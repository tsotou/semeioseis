<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελληνικό Χειρόγραφο Χαρτί</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Comfortaa:wght@400;500;600&family=Playpen+Sans:wght@400;500;600&family=Marck+Script&family=Pangolin&family=Patrick+Hand&family=Architects+Daughter&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{--s900:#1c1917;--s800:#292524;--s700:#44403c;--s600:#57534e;--s500:#78716c;--s400:#a8a29e;--s300:#d6d3d1;--s200:#e7e5e4;--amber:#92400e;--amber2:#b45309;--bg-app:#e6e2da;--header-bg:rgba(230,226,218,.88);--card-bg:#fff;--toolbar-bg:rgba(255,255,255,.93)}
[data-theme="dark"]{--s900:#f5f5f4;--s800:#e7e5e4;--s700:#d6d3d1;--s600:#a8a29e;--s500:#78716c;--s400:#57534e;--s300:#44403c;--s200:#292524;--amber:#f59e0b;--amber2:#fbbf24;--bg-app:#121212;--header-bg:rgba(24,24,27,.9);--card-bg:#1e1e24;--toolbar-bg:rgba(30,30,36,.95)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--s800);background-color:var(--bg-app);background-image:radial-gradient(circle at 50% 0%,rgba(255,255,255,.25),rgba(0,0,0,.04));overflow-x:hidden;transition:background-color .3s,color .3s}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
::selection{background:rgba(253,230,138,.6)}

/* Fonts - Fully Bilingual Greek/Latin optimized */
.font-caveat{font-family:'Caveat',cursive}
.font-comfortaa{font-family:'Comfortaa',sans-serif}
.font-playpen{font-family:'Playpen Sans',cursive}
.font-marck{font-family:'Marck Script',cursive}
.font-pangolin{font-family:'Pangolin',cursive}
.font-patrick{font-family:'Patrick Hand',cursive}
.font-architects{font-family:'Architects Daughter',cursive}
.font-philosopher{font-family:'Philosopher',sans-serif}

/* Generic UI */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500;transition:.15s;white-space:nowrap}
.btn-dark{background:var(--s800);color:var(--bg-app)}.btn-dark:hover{opacity:.9}
.btn-amber{background:var(--amber);color:#fff}.btn-amber:hover{background:var(--amber2)}
.btn-soft{background:rgba(255,255,255,.8);border:1px solid rgba(168,162,158,.6);color:var(--s900)}.btn-soft:hover{background:#fff}
[data-theme="dark"] .btn-soft{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
[data-theme="dark"] .btn-soft:hover{background:rgba(255,255,255,.18)}
.btn-danger{background:#b91c1c;color:#fff}.btn-danger:hover{background:#dc2626}
.icon-btn{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--s500);flex:none;transition:.15s}
.icon-btn:hover{background:rgba(231,229,228,.9);color:var(--s900)}
.icon-btn.danger:hover{background:#fee2e2;color:#dc2626}
.icon-btn.active{background:rgba(231,229,228,.9);color:var(--s800)}
.sep{width:1px;height:14px;background:rgba(214,211,209,.9);flex:none}
.tb-select{background:transparent;border:0;border-radius:999px;padding:4px 6px;font-size:12px;cursor:pointer;color:var(--s700)}
.tb-select:hover{background:rgba(231,229,228,.6)}

/* Home */
#homeHeader{position:sticky;top:0;z-index:30;padding:12px 20px;background:var(--header-bg);backdrop-filter:blur(12px);border-bottom:1px solid rgba(168,162,158,.3);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;transition:background-color .3s}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;min-width:200px;flex:1}
.search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--s400)}
.search input{width:100%;min-width:220px;padding:6px 12px 6px 30px;border-radius:999px;border:1px solid rgba(168,162,158,.5);background:var(--card-bg);color:var(--s900);font-size:12px}
.search input:focus{outline:2px solid rgba(180,83,9,.35)}
.seg{display:flex;align-items:center;background:var(--card-bg);padding:3px;border-radius:999px;border:1px solid rgba(214,211,209,.9)}
.seg button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--s600)}
.seg button.on{background:var(--s800);color:var(--bg-app)}
.container{max-width:1152px;margin:0 auto;padding:24px 20px 64px}
.container section{margin-bottom:34px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--s500);display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:4px}
.tab{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--s600);border:1px solid transparent}
.tab:hover{background:rgba(255,255,255,.6)}
.tab.on{background:var(--card-bg);border-color:rgba(168,162,158,.5);color:var(--s900)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:3px 10px;border-radius:999px;font-size:11px;background:var(--card-bg);border:1px solid rgba(168,162,158,.45);color:var(--s700)}
.chip:hover{opacity:.8}
.chip.on{background:var(--amber);color:#fff;border-color:var(--amber)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.boards{gap:14px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:rgba(255,251,235,.95);border:1px solid rgba(252,211,77,.8);color:#78350f;border-radius:12px;padding:10px 14px;font-size:12px;margin-bottom:22px}
.banner .grow{flex:1;min-width:200px}
.empty{text-align:center;color:var(--s500);padding:50px 10px;font-size:13px}

.doc-card{position:relative;height:16rem;border-radius:8px;overflow:hidden;border:1px solid rgba(168,162,158,.4);box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;text-align:left;cursor:pointer;transition:transform .18s,box-shadow .18s}
.doc-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px -8px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.08)}
.doc-card:focus{outline:2px solid var(--s700)}
.card-body{position:relative;z-index:2;flex:1;padding:14px 16px 0;overflow:hidden}
.card-title{font-size:23px;line-height:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title .untitled{opacity:.4;font-weight:500;font-style:italic}
.card-tags{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;margin:3px 0 4px;height:18px}
.card-tags span{font:500 10px Inter,sans-serif;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.07);white-space:nowrap;color:var(--s700)}
.card-preview{font-size:19px;line-height:24px;white-space:pre-wrap;overflow:hidden;word-break:break-word}
.card-preview .ghost{opacity:.35;font-style:italic}
.card-fade{position:absolute;left:0;right:0;bottom:22px;height:34px;pointer-events:none;z-index:3}
.card-meta{position:relative;z-index:4;display:flex;justify-content:space-between;gap:8px;padding:4px 12px;font-size:10px;background:rgba(0,0,0,.04)}
.card-actions{position:absolute;top:6px;right:6px;z-index:6;display:flex;gap:4px}
.card-actions button{height:24px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.9);font-size:11px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;align-items:center;gap:5px;color:#111}
.card-actions button:hover{background:#fff}
.card-actions button.danger:hover{background:#fee2e2;color:#b91c1c}
.card-actions button.confirm{background:#b91c1c;color:#fff}
.board-card{background:var(--card-bg);border:1px solid rgba(168,162,158,.7);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;cursor:pointer;transition:.18s;position:relative}
.board-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px -8px rgba(0,0,0,.18)}
